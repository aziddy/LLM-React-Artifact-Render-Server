name: Security Audit

on:
  push:
    branches: [main, deploy]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
